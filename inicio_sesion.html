<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso | Oasis Calama</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styleLogin.css">
</head>

<body>

    <!-- FONDO -->
    <img src="img/Fondo_Atacama.png" class="background" alt="">

    <!-- NAVBAR -->
    <header class="topbar">

        <a href="index.html">
            <img src="img/LogoB.png" class="logo-img" alt="Oasis Calama">
        </a>

        <a href="index.html" class="back-btn">
            Volver al inicio
        </a>

    </header>

    <!-- MAIN -->
    <main class="login-section">

        <section class="login-card">

            <!-- IZQUIERDA -->
            <div class="login-info">

                <span class="login-subtitle">
                    EXPERIENCIA OASIS CALAMA
                </span>

                <h1>
                    Conecta con el desierto
                </h1>

                <p>
                    Accede a experiencias exclusivas, reservas premium
                    y recorridos diseñados para descubrir la esencia
                    del norte de Chile.
                </p>

                <div class="info-boxes">
                    <div class="info-item">🌎 Rutas únicas</div>
                    <div class="info-item">🏜 Cultura atacameña</div>
                    <div class="info-item">✨ Experiencias premium</div>
                </div>

            </div>

            <!-- DERECHA -->
            <div class="login-form-box">

                <h2>Crear cuenta</h2>

                <!-- MENSAJE -->
                <div id="message" role="alert" aria-live="polite"></div>

                <!-- SWITCH -->
                <div class="form-switch">

                    <button type="button" class="switch-btn active" id="register-tab">
                        Crear cuenta
                    </button>

                    <button type="button" class="switch-btn" id="login-tab">
                        Iniciar sesión
                    </button>

                </div>

                <!-- =========================
                     REGISTRO
                ========================= -->
                <form id="register-form" class="login-form">

                    <div class="input-group">
                        <label for="nombre">Nombre completo</label>
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre"
                            autocomplete="name"
                            required
                            placeholder="Tu nombre completo"
                        >
                        <small class="error"></small>
                    </div>

                    <div class="input-group">
                        <label for="correo">Correo electrónico</label>
                        <input 
                            type="email" 
                            id="correo" 
                            name="correo"
                            autocomplete="email"
                            required
                            placeholder="correo@gmail.com"
                        >
                        <small class="error"></small>
                    </div>

                    <div class="input-group">
                        <label for="telefono">Teléfono</label>
                        <input 
                            type="tel" 
                            id="telefono" 
                            name="telefono"
                            autocomplete="tel"
                            required
                            placeholder="+56 9 1234 5678"
                        >
                        <small class="error"></small>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            autocomplete="new-password"
                            required
                            placeholder="********"
                        >
                        <small class="error"></small>
                    </div>

                    <button type="submit" class="login-btn-submit">
                        Crear cuenta
                    </button>

                </form>

                <!-- =========================
                     LOGIN
                ========================= -->
                <form id="login-form" class="login-form hidden-form">

                    <div class="input-group">
                        <label for="login-email">Correo electrónico</label>
                        <input 
                            type="email" 
                            id="login-email" 
                            name="login-email"
                            autocomplete="email"
                            required
                            placeholder="correo@gmail.com"
                        >
                        <small class="error"></small>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Contraseña</label>
                        <input 
                            type="password" 
                            id="login-password" 
                            name="login-password"
                            autocomplete="current-password"
                            required
                            placeholder="********"
                        >
                        <small class="error"></small>
                    </div>

                    <div class="remember-box">
                        <input type="checkbox" id="remember">
                        <label for="remember">Recordar sesión</label>
                    </div>

                    <button type="submit" class="login-btn-submit">
                        Ingresar
                    </button>

                </form>

                <!-- LINK INFERIOR -->
                <p class="bottom-text">
                    ¿Ya tienes cuenta?
                    <a href="#" id="switch-login-link">
                        Inicia sesión
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="js/scriptLogin.js"></script>

</body>
</html>
